<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Inglês Básico Pro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Canvas Confetti (Efeito de Vitória) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-emerald-950 text-emerald-50 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Luzes de Fundo Decorativas (Glow) -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div id="quiz-card" class="max-w-2xl w-full bg-emerald-900/80 backdrop-blur-md border border-emerald-700/50 rounded-2xl shadow-2xl p-6 sm:p-8 relative z-10">
    
    <!-- Barra de Progresso Topo -->
    <div id="progress-container" class="w-full bg-emerald-950/60 h-2.5 rounded-full mb-6 overflow-hidden border border-emerald-800/40">
      <div id="progress-bar" class="bg-emerald-400 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>

    <!-- Tela Inicial -->
    <div id="start-screen" class="text-center py-6">
      <div class="inline-flex p-4 bg-emerald-500/20 text-emerald-300 rounded-full mb-4 border border-emerald-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold mb-2 text-white">Quiz de Inglês Básico Pro</h1>
      <p class="text-emerald-200/80 mb-6">10 perguntas, 1 minuto por questão, 3 vidas e ajuda 50:50. Preparado?</p>
      
      <!-- Recorde Salvo -->
      <div class="inline-block bg-emerald-950/50 border border-emerald-700/60 rounded-lg px-4 py-2 text-sm text-emerald-200 mb-6">
        🏆 Recorde Pessoal: <span id="high-score" class="font-bold text-emerald-400">0 / 10</span>
      </div>

      <div>
        <button onclick="startQuiz()" class="btn-glow w-full sm:w-auto px-8 py-3.5 bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5">
          Iniciar Quiz
        </button>
      </div>
    </div>

    <!-- Tela do Quiz -->
    <div id="quiz-screen" class="hidden">
      <!-- Cabeçalho de Status -->
      <div class="flex flex-wrap justify-between items-center gap-2 text-sm font-medium text-emerald-200 mb-4">
        <div id="lives-container" class="flex gap-1 text-lg">
          <span id="heart-1">❤️</span>
          <span id="heart-2">❤️</span>
          <span id="heart-3">❤️</span>
        </div>

        <span id="timer-display" class="px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-bold">
          ⏱️ 01:00
        </span>

        <span id="score-count" class="text-emerald-300 font-semibold">Pontos: 0</span>
      </div>

      <div class="flex justify-between items-center mb-4">
        <span id="question-number" class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Pergunta 1 de 10</span>
        
        <!-- Botão 50:50 -->
        <button id="help-5050-btn" onclick="use5050()" class="px-3 py-1 bg-teal-800/50 hover:bg-teal-700/60 border border-teal-500/40 text-teal-200 text-xs font-bold rounded-lg transition-all flex items-center gap-1">
          💡 Ajuda 50:50 <span id="help-badge" class="bg-teal-500 text-emerald-950 text-[10px] px-1.5 py-0.2 rounded-full font-bold">1</span>
        </button>
      </div>

      <h2 id="question-text" class="text-xl sm:text-2xl font-bold mb-6 text-white leading-relaxed"></h2>

      <div id="options-container" class="space-y-3 mb-6"></div>

      <!-- Caixas de Explicação -->
      <div id="explanation" class="hidden p-4 rounded-xl mb-6 bg-emerald-950/60 border border-emerald-700/60 text-emerald-100 text-sm">
        <span class="font-semibold text-emerald-300 block mb-1">Explicação:</span>
        <p id="explanation-text"></p>
      </div>

      <button id="next-btn" onclick="nextQuestion()" class="btn-glow hidden w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold rounded-xl transition-all">
        Próxima Pergunta
      </button>
    </div>

    <!-- Tela de Resultado -->
    <div id="result-screen" class="hidden py-6">
      <div class="text-center mb-6">
        <div id="result-icon" class="inline-flex p-4 rounded-full mb-4"></div>
        <h2 id="result-title" class="text-3xl font-bold mb-2 text-white"></h2>
        <p class="text-emerald-200/80 mb-2">Sua pontuação final foi:</p>
        <div class="text-5xl font-extrabold text-emerald-400 mb-4" id="final-score">0 / 10</div>
        <p id="result-message" class="text-lg font-medium text-emerald-100 mb-6"></p>
      </div>

      <!-- Dicas de Estudo -->
      <div class="bg-emerald-950/50 border border-emerald-800/80 rounded-xl p-5 mb-8 text-left">
        <h3 class="text-emerald-300 font-semibold text-base mb-3 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Dicas de Estudos e Recomendação
        </h3>
        <ul id="study-tips" class="space-y-2 text-emerald-100/90 text-sm list-disc list-inside"></ul>
      </div>

      <div class="text-center">
        <button onclick="restartQuiz()" class="btn-glow w-full sm:w-auto px-8 py-3.5 bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5">
          Tentar Novamente
        </button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
